name: Import verified VampDAW alpha source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Locate the prepared source snapshot
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/releases.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          releases = json.loads((Path(os.environ['RUNNER_TEMP']) / 'releases.json').read_text())
          release = next(r for r in releases if r['tag_name'] == 'v0.4.19-alpha')
          asset = next(a for a in release['assets'] if a['name'] == 'VampDAW-0.4.19-GitHub-Repository.zip')
          assert asset['size'] == 26504835, 'Unexpected source snapshot size'
          assert asset['state'] == 'uploaded', 'Source upload is incomplete'
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('VAMP_SOURCE_ASSET_ID=' + str(int(asset['id'])) + '\n')
          PY

      - name: Download and validate the exact source archive
        shell: bash
        run: |
          set -euo pipefail
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$VAMP_SOURCE_ASSET_ID" > "$RUNNER_TEMP/vamp-source.zip"
          python3 - <<'PY'
          import hashlib, os, zipfile
          from pathlib import Path
          archive = Path(os.environ['RUNNER_TEMP']) / 'vamp-source.zip'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '6c5a09e32ee541b5f362dc6e37873b8ec6b61d0969addaff28c754f376268a31', 'Source snapshot SHA-256 mismatch'
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None, 'Invalid ZIP'
          print('Exact prepared source archive verified.')
          PY

      - name: Import source files without running application code
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 "https://github.com/$GITHUB_REPOSITORY.git" checkout
          if [ -f checkout/src/main.cpp ]; then
            echo 'Source has already been imported; leaving the repository unchanged.'
            exit 0
          fi
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path, PurePosixPath
          root = Path('checkout').resolve()
          archive = Path(os.environ['RUNNER_TEMP']) / 'vamp-source.zip'
          with zipfile.ZipFile(archive) as z:
              for entry in z.infolist():
                  if entry.is_dir():
                      continue
                  assert entry.filename.startswith('VampDAW/'), 'Unexpected archive root'
                  name = entry.filename[len('VampDAW/'):]
                  relative = PurePosixPath(name)
                  assert name and not relative.is_absolute() and '..' not in relative.parts and '\\' not in name and ':' not in name
                  assert '.git' not in relative.parts and 'workflows' not in relative.parts
                  destination = root.joinpath(*relative.parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(z.read(entry))
          manifest = json.loads((root / 'SOURCE-SHA256.json').read_text())
          assert len(manifest) == 415
          for name, expected in manifest.items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected, name
          print('Verified all 415 corresponding-source files after extraction.')
          PY
          git -C checkout config user.name 'github-actions[bot]'
          git -C checkout config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C checkout add --all
          if git -C checkout diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git -C checkout commit -m 'Import verified VampDAW 0.4.19 alpha source and GitHub documentation'
          gh auth setup-git --hostname github.com
          git -C checkout push origin HEAD:main
