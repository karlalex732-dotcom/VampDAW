name: Feature request / Предложение
description: Suggest a workflow improvement / Предложить улучшение
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow problem / Задача
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior / Предлагаемое поведение
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and examples / Альтернативы и примеры
